# Model 1: ordinary five-brand YOLOv8n detection baseline.
# This creates a new run and does not resume/overwrite the historical AXE run.
model: yolov8n.pt
data: data/brand_5brands_yolo/data.yaml
project: runs/model1_brand5
name: yolov8n_100ep_s42

train:
  epochs: 100
  imgsz: 640
  batch: 8
  workers: 0
  device: 0
  amp: true
  seed: 42
  deterministic: true
  patience: 0
  single_cls: false
  pretrained: true
  resume: false
  exist_ok: false
  save: true
  save_period: -1
  plots: true
  val: true
  cache: false

  optimizer: auto
  weight_decay: 0.0005
  cos_lr: false
  close_mosaic: 10

  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.0
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

artifacts:
  evaluate_test_split: false

compatibility:
  verified_ultralytics: 8.3.155
  install_or_upgrade_automatically: false
